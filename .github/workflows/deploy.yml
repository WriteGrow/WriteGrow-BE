name: Deploy

# main 에 반영되면 테스트 → 이미지 빌드(GHCR) → 서버 배포까지 이어진다.
# 서버는 이미지를 pull 만 하므로 소스도 JDK 도 필요 없다.

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 배포가 겹치면 컨테이너 교체가 엉킨다. 앞선 배포를 취소하지 않고 순서대로 처리한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 은 대문자를 받지 않는다. 조직명이 WriteGrow 라 반드시 낮춰야 한다.
      - name: 이미지 이름 결정
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/writegrow-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: compose 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/writegrow

      - name: 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,POSTGRES_PASSWORD,S3_BUCKET,S3_ACCESS_KEY,S3_SECRET_KEY
          script: |
            set -euo pipefail
            cd /opt/writegrow

            # 비밀 값이 들어가므로 소유자만 읽게 만든다.
            umask 077
            cat > .env <<EOF
            POSTGRES_DB=writegrow
            POSTGRES_USER=writegrow
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            S3_BUCKET=${S3_BUCKET}
            S3_REGION=ap-northeast-2
            S3_ACCESS_KEY=${S3_ACCESS_KEY}
            S3_SECRET_KEY=${S3_SECRET_KEY}
            AI_STUB=true
            AI_BASE_URL=http://ai:8000
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            # GITHUB_TOKEN 은 이 실행 동안만 유효하다. 서버에 장기 토큰을 남기지 않는다.
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull app
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker logout ghcr.io

            # 기동 확인. S3 설정이 틀리면 S3BucketVerifier 가 기동을 막으므로 여기서 잡힌다.
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q UP; then
                echo "기동 확인 완료"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "기동 확인 실패 — 최근 로그"
            docker compose -f docker-compose.prod.yml logs --tail=120 app
            exit 1
