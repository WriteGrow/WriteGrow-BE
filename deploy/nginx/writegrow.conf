# WriteGrow 백엔드 리버스 프록시.
#
# 도메인을 사지 않고 sslip.io 로 HTTPS 를 붙인다. sslip.io 는 IP 를 그대로 호스트명으로
# 돌려주는 무료 DNS 라(203.0.113.10.sslip.io → 203.0.113.10), Let's Encrypt 인증서를
# 정상 발급받을 수 있다. HTTPS 가 필요한 이유는 보안뿐이 아니다 — 프론트가 HTTPS 로
# 배포되면 브라우저가 HTTP API 호출을 혼합 콘텐츠로 차단해서 아예 통신이 안 된다.
#
# 적용 순서는 deploy/README.md 참고. __HOST__ 를 실제 호스트명으로 치환해서 쓴다.
#
# 앱은 127.0.0.1:8080 에만 바인딩되어 있으므로(docker-compose.prod.yml) 외부 요청은
# 반드시 여기를 거친다. 접근 제어를 넣게 되면 이 파일 한 곳만 고치면 된다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 인증서 자동 갱신(webroot 방식)에 필요하다. 리다이렉트보다 먼저 매칭되어야 하므로 ^~ 를 쓴다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;

    # certbot 이 설치하는 options-ssl-nginx.conf 를 include 하지 않고 직접 적는다.
    # 그 파일은 nginx 플러그인을 함께 설치했을 때만 생기고, 없으면 nginx 가 기동에 실패한다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 손글씨 이미지 업로드. Spring 의 max-request-size 가 12MB 라 같은 값으로 맞춘다.
    # 여기가 더 작으면 Spring 예외 대신 nginx 의 413 이 나가 원인을 찾기 어렵다.
    client_max_body_size 12M;

    # prod 프로파일이 springdoc 을 끄지만, 프로파일을 잘못 주고 띄웠을 때를 대비해 경로도 막는다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        return 404;
    }

    # 헬스체크만 열어 두고 나머지 액추에이터 경로는 막는다.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 손글씨 제출은 202 로 바로 끝나지만 이미지 업로드가 느릴 수 있어 여유를 둔다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
