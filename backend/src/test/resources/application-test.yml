# 통합 테스트 전용 설정.
# datasource 는 Testcontainers 의 @ServiceConnection 이 주입하므로 여기에 URL 을 두지 않는다.

spring:
  jpa:
    properties:
      hibernate:
        show_sql: false

writegrow:
  s3:
    bucket: writegrow-test
    region: ap-northeast-2
    endpoint: ""
    key-prefix: test/
    # 자격 증명을 명시해 StaticCredentialsProvider 를 태운다. 테스트가 실제 S3 를 호출하지는 않지만,
    # 자격 증명 탐색 체인이 CI 환경을 뒤지는 일 자체를 만들지 않는다.
    access-key: test
    secret-key: test
    presign-duration: PT10M
    # 테스트에는 실제 버킷이 없다. 켜 두면 컨텍스트 로딩이 실제 AWS 로 요청을 보내다 실패한다.
    verify-on-startup: false
  ai:
    base-url: http://localhost:8000
    # 테스트에서는 실제 AI 서버를 호출하지 않는다.
    stub: true

logging:
  level:
    com.example.writegrow: info
