# 운영 환경. 모든 비밀 값은 환경 변수로 주입한다.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    properties:
      hibernate:
        format_sql: false

springdoc:
  # 운영 환경에서는 API 문서를 노출하지 않는다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

writegrow:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    # 실제 AWS 엔드포인트를 사용한다.
    endpoint: ""
    # dev 와 같은 버킷을 쓰므로 접두사로 영역을 나눈다.
    key-prefix: prod/
    # 서버가 AWS 가 아니라 IAM 역할을 쓸 수 없으므로 키를 직접 주입한다.
    # 비워 두면 DefaultCredentialsProvider(AWS_ACCESS_KEY_ID 등)로 내려간다.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presign-duration: PT10M
  ai:
    base-url: ${AI_BASE_URL}
    # AI 서버가 배포되기 전까지는 AI_STUB=true 로 띄운다. 이미지를 다시 빌드하지 않고
    # .env 만 고쳐 전환할 수 있어야 하므로 환경 변수로 둔다.
    stub: ${AI_STUB:false}

logging:
  level:
    com.example.writegrow: info
