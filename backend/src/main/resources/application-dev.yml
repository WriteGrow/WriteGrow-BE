# 로컬 개발 환경.
# 사전 준비: 프로젝트 루트에서 `docker compose up -d` (Postgres + LocalStack)

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/writegrow
    username: writegrow
    password: writegrow
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        show_sql: true

writegrow:
  s3:
    bucket: writegrow-dev
    region: ap-northeast-2
    # LocalStack 을 사용하므로 엔드포인트를 덮어쓰고 path-style 접근을 켠다.
    endpoint: http://localhost:4566
    path-style-access: true
    access-key: test
    secret-key: test
    presign-duration: PT10M
  ai:
    base-url: http://localhost:8000
    # AI 서버(WriteGrow-BE/ai)가 준비되기 전까지 StubAiAnalysisClient 로 동작한다.
    # 실제 AI 서버에 붙여 볼 때는 false 로 바꾸고 base-url 을 맞춘다.
    stub: true

logging:
  level:
    com.example.writegrow: debug
