# 로컬 개발 환경.
# 사전 준비:
#   1. 프로젝트 루트에서 `docker compose up -d` (Postgres)
#   2. 환경 변수 S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY 설정
#
# S3 는 운영과 같은 실제 버킷을 쓰되 key-prefix 로 영역을 나눈다. LocalStack 을 쓰지 않는 이유는
# 로컬에서 통과한 것이 실제 AWS 에서도 통과한다는 근거가 되어야 하기 때문이다.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/writegrow
    username: writegrow
    password: writegrow
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        show_sql: true

writegrow:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    # 실제 AWS 엔드포인트를 사용한다.
    endpoint: ""
    # 운영 객체와 섞이지 않도록 dev/ 아래에만 쓴다.
    key-prefix: dev/
    # 환경 변수가 있으면 그 값으로 StaticCredentialsProvider 를, 없으면 DefaultCredentialsProvider 를
    # 쓴다(S3Config#awsCredentialsProvider). prod 도 같은 이름을 쓴다.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presign-duration: PT10M
  ai:
    base-url: http://localhost:8000
    # AI 서버(WriteGrow-BE/ai)가 준비되기 전까지 StubAiAnalysisClient 로 동작한다.
    # 실제 AI 서버에 붙여 볼 때는 false 로 바꾸고 base-url 을 맞춘다.
    stub: true

logging:
  level:
    com.example.writegrow: debug
