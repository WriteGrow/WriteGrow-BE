# 운영 서버용. Postgres 와 애플리케이션을 같은 서버에 함께 띄운다.
# 실행: docker compose -f docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: writegrow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    # 호스트로 포트를 열지 않는다. 같은 compose 네트워크의 app 만 접근한다.
    volumes:
      - writegrow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # 이미지는 GitHub Actions 가 빌드해 GHCR 에 올린다. 서버는 pull 만 한다.
    # IMAGE_TAG 는 배포 워크플로가 커밋 SHA 로 .env 에 써 넣는다. 롤백은 이 값만 바꾸면 된다.
    image: ghcr.io/writegrow/writegrow-backend:${IMAGE_TAG:-latest}
    container_name: writegrow-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_STUB: ${AI_STUB:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      # 호스트 루프백에만 붙인다. 외부 요청은 반드시 nginx 를 거치게 해서
      # 로깅과 접근 제어를 한 곳에 모은다. "8080:8080" 으로 두면 nginx 를 우회할 수 있다.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ai:
    # 이미지는 GitHub Actions 가 빌드해 GHCR 에 올린다. 백엔드와 같은 커밋 SHA 로 태깅된다.
    image: ghcr.io/writegrow/writegrow-ai:${IMAGE_TAG:-latest}
    container_name: writegrow-ai
    environment:
      TZ: Asia/Seoul
      # 이미지에 들어 있지 않다. 없으면 서버는 뜨지만 OCR 과 오류 분석만 실패한다.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # 호스트에 포트를 열지 않는다. 백엔드만 compose 네트워크로 http://ai:8000 을 부른다.
    # 손글씨 이미지와 획은 요청 본문이 아니라 presigned URL 로 전달되므로,
    # 이 컨테이너에서 S3 와 OpenAI 로 나가는 아웃바운드가 열려 있어야 한다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  writegrow-postgres-data:
